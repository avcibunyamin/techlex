name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: ""
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site lives under /techlex/ on GitHub Pages. app.json has no baseUrl (it was dropped on
      # 2026-09-15 for local and store builds), so it is set here for the Pages build only.
      - name: Base URL /techlex for Pages
        run: |
          node -e '
            const fs = require("fs"), app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.experiments = { ...app.expo.experiments, baseUrl: "/techlex" };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '

      - run: npx expo export --platform web --clear
        timeout-minutes: 5

      # Refuse to deploy a page whose script paths miss the /techlex base (a blank site).
      - name: Script paths use /techlex
        run: |
          ls -la dist/ && grep -o 'src="[^"]*"' dist/index.html
          grep -q 'src="/techlex/_expo/' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
